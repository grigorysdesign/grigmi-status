name: watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Прошлое состояние
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Проверка сайтов
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: bash check.sh
      - name: Запомнить состояние
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}
      # GitHub выключает расписание в открытом репозитории без коммитов 60 дней — раз в месяц отметка «жив»
      - name: Отметка раз в месяц
        if: github.event_name == 'schedule'
        run: |
          m=$(date -u +%Y-%m)
          if [ "$(cat alive 2>/dev/null)" != "$m" ]; then
            echo "$m" > alive
            git config user.name "grigmi-watch"; git config user.email "watch@users.noreply.github.com"
            git add alive && git commit -m "alive $m" && git push
          fi
